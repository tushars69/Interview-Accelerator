[project]
name = "interview-accelerator"
version = "0.1.0"
description = "AI-powered Interview Accelerator — JD/Resume analysis, adaptive 3-level AI interview with voice, and a full performance report."
authors = [{ name = "Tushar" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi (==0.141.1)",
    "uvicorn[standard] (==0.52.4)",
    "python-multipart (==0.0.32)",
    "pydantic (==2.13.4)",
    "pydantic-settings (==2.15.0)",
    "python-dotenv (==1.2.2)",
    "groq (==1.6.0)",
    "sqlalchemy (==2.0.52)",
    "pdfplumber (==0.11.9)",
    "python-docx (==1.2.0)",
    "requests (==2.33.1)",
    "streamlit (==1.62.0)",
    "plotly (==6.9.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "==8.3.3"
httpx = "==0.27.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
